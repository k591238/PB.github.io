<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>講義 · WU CHENG-RU</title>
  <meta name="description"
    content="吳承儒 Wu Cheng-Ru（PB / Pen_bit）的課程講義與教學資料。Course handouts and teaching materials by Wu Cheng-Ru." />
  <link rel="canonical" href="https://k591238.github.io/PB.github.io/handouts/" />
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap" />
  <style>
    :root {
      --bg: #101116;
      --border: rgba(255, 255, 255, 0.08);
      --text: #ebebeb;
      --text-secondary: #8a8a8a;
      --accent: #c8ee60;
      --font: 'Inter', 'Noto Sans TC', sans-serif;
      --font-heading: 'Space Grotesk', 'Noto Sans TC', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.7;
      min-height: 100vh;
      padding: 0 16px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 2rem 0 6rem;
    }

    .back {
      display: inline-flex;
      gap: 0.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      transition: color 0.25s;
    }

    .back:hover {
      color: var(--text);
    }

    header {
      padding: 5rem 0 3rem;
    }

    h1 {
      font-family: var(--font-heading);
      font-weight: 500;
      font-size: clamp(2.4rem, 1.6rem + 4vw, 4.5rem);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    h1 span {
      color: var(--accent);
    }

    .intro {
      margin-top: 1.2rem;
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    ul {
      list-style: none;
      border-top: 1px solid var(--border);
    }

    li a {
      display: grid;
      grid-template-columns: 4.5rem minmax(0, 1fr) auto;
      gap: 1.2rem;
      align-items: baseline;
      padding: 1.6rem 0;
      border-bottom: 1px solid var(--border);
    }

    .year {
      font-family: var(--font-heading);
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .title {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      font-weight: 500;
      line-height: 1.3;
      transition: color 0.25s;
    }

    .meta {
      margin-top: 0.3rem;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .desc {
      margin-top: 0.6rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
      max-width: 60ch;
    }

    .arrow {
      color: var(--text-secondary);
      transition: color 0.25s, transform 0.25s;
    }

    li a:hover .title,
    li a:hover .arrow {
      color: var(--accent);
    }

    li a:hover .arrow {
      transform: translateX(4px);
    }

    footer {
      margin-top: 4rem;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      opacity: 0.6;
    }

    @media (max-width: 600px) {
      header {
        padding: 3.5rem 0 2rem;
      }

      li a {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 0.4rem 1rem;
      }

      .year {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <a class="back" href="../#about">← WU CHENG-RU</a>

    <header>
      <h1>Teaching<span>.</span></h1>
      <p class="intro">課程講義與教學資料。Course handouts and teaching materials.</p>
    </header>

    <ul>
      <li>
        <a href="laser-pop/">
          <span class="year">2026</span>
          <div>
            <p class="title">雷射 POP 工作流</p>
            <p class="meta">TouchDesigner 雷射教學 · POP → Laser CHOP · Helios DAC</p>
            <p class="desc">從雷射硬體與器材、路徑與掃描時間的邏輯，到在 TouchDesigner 用 POP 做出圖形送到雷射。</p>
          </div>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
    </ul>

    <footer>&copy; 2026 WU CHENG-RU</footer>
  </div>
</body>

</html>
