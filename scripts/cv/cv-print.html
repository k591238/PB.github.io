<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>WU CHENG-RU — CV</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=block" />
  <style>
    /* 頁邊距設 0 才能讓銀灰底滿版；留白改由 body padding＋box-decoration-break: clone 在每頁重複 */
    @page {
      size: A4;
      margin: 0;
    }

    /* 字級（使用者指定方案 B）：內文 12pt、次要資訊 10.5pt、頁尾 9pt，最小不低於 9pt */
    :root {
      --paper: #e9e9e6;
      --ink: #161616;
      --ink-2: #3a3a38;
      --muted: #6c6c67;
      --line: rgba(22, 22, 22, 0.14);
      --accent: #c8ee60;
      --sans: 'Inter', 'Noto Sans TC', sans-serif;
      --heading: 'Space Grotesk', 'Noto Sans TC', sans-serif;
      --fs-body: 12pt;
      --fs-small: 10.5pt;
      --fs-foot: 9pt;
    }

    html[lang="zh-Hant"] {
      --sans: 'Noto Sans TC', 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      font-family: var(--sans);
      font-size: var(--fs-body);
      line-height: 1.55;
      color: var(--ink-2);
      padding: 16mm 17mm 24mm;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    /* 銀灰底：position: fixed 在列印時會重複出現在每一頁 */
    .paper,
    .grain {
      position: fixed;
      inset: 0;
    }

    .paper {
      z-index: -2;
      background-color: var(--paper);
      background-image:
        radial-gradient(120% 80% at 15% 0%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 60%),
        linear-gradient(165deg, #ececea 0%, #e3e4e1 60%, #e9e9e6 100%);
    }

    /* 細雜訊：640px 的 4 階灰貼圖縮成 320px 顯示（顆粒約 0.13mm），淡度由 opacity 控制；
       貼圖尺寸用整數 px，避免 PDF 裡出現接縫細線 */
    .grain {
      z-index: -1;
      background-image: url("noise.png");
      background-size: 320px 320px;
      opacity: 0.07;
    }

    .foot {
      position: fixed;
      left: 17mm;
      right: 17mm;
      bottom: 9mm;
      display: flex;
      justify-content: space-between;
      padding-top: 2mm;
      border-top: 0.4pt solid var(--line);
      font-size: var(--fs-foot);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      display: grid;
      grid-template-columns: 27mm 1fr 23mm;
      gap: 6mm;
      align-items: end;
      padding-bottom: 6mm;
      border-bottom: 0.6pt solid var(--ink);
    }

    .photo {
      display: block;
      width: 27mm;
      height: 34mm;
      object-fit: cover;
      outline: 0.4pt solid rgba(22, 22, 22, 0.25);
    }

    h1 {
      white-space: nowrap;
      font-family: var(--heading);
      font-weight: 700;
      font-size: 28pt;
      line-height: 1;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    h1 .tc {
      font-family: 'Noto Sans TC', sans-serif;
      font-weight: 500;
      font-size: 17pt;
      letter-spacing: 0.08em;
      margin-left: 3mm;
      color: var(--ink-2);
    }

    .role {
      margin-top: 2.5mm;
      font-size: var(--fs-small);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.35;
    }

    .contact {
      margin-top: 4mm;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.6mm 4mm;
      font-size: var(--fs-small);
      line-height: 1.35;
    }

    .contact dt {
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .contact dd {
      color: var(--ink);
    }

    .qr {
      display: block;
      width: 23mm;
      height: 23mm;
    }

    section {
      margin-top: 7mm;
    }

    .label,
    .cv-section-title {
      display: flex;
      align-items: center;
      gap: 2.6mm;
      font-family: var(--heading);
      font-weight: 500;
      font-size: var(--fs-small);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink);
      padding-bottom: 2mm;
      margin-bottom: 3.5mm;
      border-bottom: 0.4pt solid var(--line);
      break-after: avoid;
    }

    .label::before,
    .cv-section-title::before {
      content: '';
      width: 2mm;
      height: 2mm;
      background: var(--accent);
      outline: 0.3pt solid rgba(22, 22, 22, 0.35);
      flex: none;
    }

    .bio p {
      margin-bottom: 2.4mm;
    }

    .bio em,
    .cv em {
      font-style: italic;
    }

    /* CV（沿用網站的 class，從 index.html 讀進來） */
    .cv-section {
      margin-top: 7mm;
    }

    .cv-row {
      display: grid;
      grid-template-columns: 22mm 1fr;
      gap: 0 3mm;
      margin-bottom: 2mm;
      align-items: baseline;
      break-inside: avoid;
    }

    .cv-year {
      white-space: nowrap;
      font-size: var(--fs-small);
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .cv-detail,
    .cv-edu {
      font-size: var(--fs-body);
      line-height: 1.5;
      color: var(--ink-2);
    }

    .cv-bold {
      color: var(--ink);
      font-weight: 500;
    }

    .cv-sub {
      color: var(--muted);
      font-size: var(--fs-small);
      white-space: nowrap;
    }

    .nowrap {
      white-space: nowrap;
    }

    .text-link {
      color: var(--ink);
      border-bottom: 0.5pt solid rgba(22, 22, 22, 0.3);
    }
  </style>
</head>

<body>
  <div class="paper"></div>
  <div class="grain"></div>
  <div class="foot"><span id="foot-title"></span><span id="foot-web"></span></div>

  <header>
    <img class="photo" id="photo" alt="WU CHENG-RU" />
    <div>
      <h1><span id="name"></span><span class="tc">吳承儒</span></h1>
      <p class="role" id="role"></p>
      <dl class="contact">
        <dt>Email</dt>
        <dd><a id="email"></a></dd>
        <dt>Instagram</dt>
        <dd><a id="ig"></a></dd>
        <dt>Portfolio</dt>
        <dd><a id="web"></a></dd>
      </dl>
    </div>
    <img class="qr" src="qr.svg" alt="Portfolio QR code" />
  </header>

  <section class="bio">
    <p class="label" id="bio-label"></p>
    <div id="bio"></div>
  </section>

  <section class="cv" id="cv"></section>

  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const lang = params.get('lang') === 'zh' ? 'zh' : 'en';
      document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
      const html = await (await fetch('../../index.html')).text();
      const site = new DOMParser().parseFromString(html, 'text/html');
      const $ = sel => site.querySelector(sel);

      document.getElementById('photo').src = '../../' + $('.about-photo').getAttribute('src');
      document.getElementById('name').textContent = $('.about-name').textContent.trim();
      // 每個職稱各自不換行，避免「AV／PERFORMER」被拆成兩行
      const roles = $('.about-role').textContent.split('·').map(r => r.replace(/\s+/g, ' ').trim()).filter(Boolean);
      const roleEl = document.getElementById('role');
      roles.forEach((r, i) => {
        const span = document.createElement('span');
        span.className = 'nowrap';
        span.textContent = r + (i < roles.length - 1 ? ' ·' : '');
        roleEl.append(span, ' ');
      });

      const mail = $('.social-list a[href^="mailto:"]').getAttribute('href');
      const email = document.getElementById('email');
      email.href = mail;
      email.textContent = mail.replace('mailto:', '');

      const igUrl = $('.social-list a[href*="instagram.com"]').getAttribute('href');
      const ig = document.getElementById('ig');
      ig.href = igUrl;
      ig.textContent = '@' + igUrl.replace(/\/$/, '').split('/').pop();

      const webUrl = $('link[rel="canonical"]').getAttribute('href');
      const web = document.getElementById('web');
      web.href = webUrl;
      web.textContent = webUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');

      const updated = params.get('updated') || '';
      document.getElementById('foot-title').textContent =
        `WU CHENG-RU — ${lang === 'zh' ? '簡歷' : 'Curriculum Vitae'}${updated ? ' · Updated ' + updated : ''}`;
      document.getElementById('foot-web').textContent = web.textContent;

      document.getElementById('bio-label').textContent = lang === 'zh' ? '簡介' : 'Bio';
      document.getElementById('bio').innerHTML = $(`.bio-text.${lang}`).innerHTML;
      document.getElementById('cv').innerHTML = $(`.cv-content.${lang}`).innerHTML;
      document.querySelectorAll('#cv a, #bio a').forEach(a => a.removeAttribute('target'));

      await document.fonts.ready;
      await Promise.all([...document.images].map(img => img.complete ? null : new Promise(r => { img.onload = img.onerror = r; })));
      window.__cvReady = true;
    })();
  </script>
</body>

</html>
